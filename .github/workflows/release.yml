name: 'publish'

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0). If empty, uses version from tauri.conf.json'
        required: false
        default: ''

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: get version
        id: version
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> $GITHUB_OUTPUT

      - name: create release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.event.inputs.version || format('app-v{0}', steps.version.outputs.value) }}
          RELEASE_NAME: ${{ github.event.inputs.version || format('App v{0}', steps.version.outputs.value) }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG_NAME,
              name: process.env.RELEASE_NAME,
              body: 'See the assets to download this version and install.',
              draft: true,
              prerelease: false
            })
            return data.id

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    concurrency:
      group: publish-${{ github.run_id }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libjavascriptcoregtk-4.1-dev

      - name: install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Dropbox app key, baked into the binary by `option_env!` at compile
          # time. Not a secret — the login is PKCE, so there is no client
          # secret — it just shouldn't be hardcoded per fork. If the repo
          # secret is unset this builds fine and Dropbox sync reports that the
          # build has no app key, rather than failing the login silently.
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          # This variable fixes the EGL_BAD_ALLOC crash on many Linux distros
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
        with:
          # On Linux, route the build through a wrapper that strips
          # Wayland/xkbcommon/xcb libs the AppImage bundler pulls in from this
          # Ubuntu 22.04 runner. Those bundled libs shadow the host's own and
          # crash newer Mesa builds on Wayland (EGL_BAD_PARAMETER) on distros
          # like Arch, Fedora, NixOS and openSUSE. See tauri-apps/tauri#15976
          # and .github/scripts/strip-appimage-egl-libs.sh.
          tauriScript: ${{ matrix.platform == 'ubuntu-22.04' && 'bash ./.github/scripts/tauri-build.sh' || '' }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}