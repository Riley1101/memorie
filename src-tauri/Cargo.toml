[package]
name = "memoire"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "memoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.42"
dashmap = "6.1.0"
dirs = "6.0.0"

futures = "0.3.31"
futures-util = "0.3.31"

kalosm = { version = "0.4.0", features = ["language", "llama", "bert", "surrealdb"] }
kalosm-common = "0.4.0"
kalosm-llama = "0.4.3"
kalosm-sample = "0.4.1"
rbert = "0.4.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
surrealdb = { version = "2.3.10", features = ["kv-mem", "kv-surrealkv"] }

tauri = { version = "2", features = [] }
tauri-plugin-devtools = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-opener = "2"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = { version = "0.7.16" }

uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10.9"
hex = {version = "0.4.3", features = ["serde"] }
tauri-plugin-log = "2.9.0"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
docx-rs = "0.4"
epub-builder = { version = "0.8", default-features = false, features = ["zip-library"] }
regex = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
tauri-plugin-dialog = "2"
typst = "0.15"
typst-pdf = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "0.15"

[dev-dependencies]
tempfile = "3.23.0"

