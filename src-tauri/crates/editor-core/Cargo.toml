[package]
name = "editor-core"
version = "0.1.0"
edition = "2021"
description = "A reusable document model and editing engine for Markdown-backed writing apps."
license = "MIT"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
